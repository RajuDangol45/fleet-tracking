<div class="fleet-map">
  <div class="header">
    <h2>Live Fleet Map</h2>
    <button (click)="refreshMap()" class="btn btn-primary">
      Refresh
    </button>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading fleet data...</p>
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div [hidden]="loading" class="content">
    <!-- Filters -->
    <div class="filters-section">
      <h3>Filter Fleet</h3>
      <div class="filters-row">
        <div class="filter-group">
          <label for="filterDriver">Driver:</label>
          <select 
            id="filterDriver" 
            [(ngModel)]="filterDriver"
            (ngModelChange)="onFilterChange()"
            class="filter-control">
            <option value="">All Drivers</option>
            <option *ngFor="let driver of drivers" [value]="driver.id">
              {{ driver.name }}
            </option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterVehicle">Vehicle:</label>
          <select 
            id="filterVehicle" 
            [(ngModel)]="filterVehicle"
            (ngModelChange)="onFilterChange()"
            class="filter-control">
            <option value="">All Vehicles</option>
            <option *ngFor="let vehicle of vehicles" [value]="vehicle.id">
              {{ vehicle.registration }}
            </option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterStatus">Delivery Status:</label>
          <select 
            id="filterStatus" 
            [(ngModel)]="filterStatus"
            (ngModelChange)="onFilterChange()"
            class="filter-control">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="assigned">Assigned</option>
            <option value="in-transit">In Transit</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="filter-group clear-btn">
          <button (click)="clearFilters()" class="btn btn-secondary">
            Clear Filters
          </button>
        </div>
      </div>
    </div>

    <div class="map-container">
      <div id="fleet-map" class="map"></div>
    </div>
  </div>
</div>
