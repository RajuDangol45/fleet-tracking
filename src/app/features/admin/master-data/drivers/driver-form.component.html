<div class="driver-form">
  <div class="form-header">
    <h2>{{ isEditMode ? 'Edit Driver' : 'Create New Driver' }}</h2>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading driver details...</p>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <form *ngIf="!loading" [formGroup]="driverForm" (ngSubmit)="onSubmit()" class="form">
    <div class="form-group">
      <label for="name">Full Name *</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        placeholder="Enter driver's full name"
        [class.error]="getFieldError('name')"
      />
      <div *ngIf="getFieldError('name')" class="field-error">
        {{ getFieldError('name') }}
      </div>
    </div>

    <div class="form-group">
      <label for="license">License Number *</label>
      <input
        type="text"
        id="license"
        formControlName="license"
        placeholder="e.g., DL-123456"
        [class.error]="getFieldError('license')"
      />
      <div *ngIf="getFieldError('license')" class="field-error">
        {{ getFieldError('license') }}
      </div>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number *</label>
      <input
        type="tel"
        id="phone"
        formControlName="phone"
        placeholder="e.g., +1-555-0100"
        [class.error]="getFieldError('phone')"
      />
      <div *ngIf="getFieldError('phone')" class="field-error">
        {{ getFieldError('phone') }}
      </div>
    </div>

    <div class="form-actions">
      <button type="button" (click)="cancel()" class="btn btn-secondary">
        Cancel
      </button>
      <button type="submit" [disabled]="saving" class="btn btn-primary">
        <span *ngIf="saving">{{ isEditMode ? 'Updating...' : 'Creating...' }}</span>
        <span *ngIf="!saving">{{ isEditMode ? 'Update Driver' : 'Create Driver' }}</span>
      </button>
    </div>
  </form>
</div>
